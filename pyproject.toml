[project]
name = "myrecorder"
version = "0.1.0"
description = "NicoChannel live watcher and recorder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10.0",
  "pyyaml>=6.0.0",
  "yt-dlp>=2025.1.15",
  "websockets>=12.0",
]

[project.scripts]
myrecorder = "myrecorder.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["myrecorder*"]
