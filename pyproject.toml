[project]
name = "myrecorder"
version = "0.1.0"
description = "High-concurrency live stream recorder framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10.0",
  "aiosqlite>=0.20.0",
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "streamlink>=7.0.0",
]

[project.scripts]
myrecorder = "myrecorder.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["myrecorder*"]
